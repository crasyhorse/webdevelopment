<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Task Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <h1>Task Manager</h1>
        <p>Manage your tasks in one place.</p>
        <div>
            <a href="#tasks">Tasks</a>
        </div>

        <div>

                    <label>New task</label>
                    <input type="text">
                    <button>Add task</button>
                </form>
            </div>
        </div>
    </body>
</html>

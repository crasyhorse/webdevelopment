<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Manager</title>
    </head>
    <body>
        <header>
            <h1>Task Manager</h1>
            <p>Manage your tasks in one place.</p>
            <nav>
                <a href="#tasks">Tasks</a>
            </nav>
        </header>

        <main>
            <section id="tasks">
                <h2 id="tasks-heading">Tasks</h2>

                <ul>
                    <li>Learn HTML document structure</li>
                    <li>Review semantic HTML</li>
                </ul>

                <form>
                    <label>New task</label>
                    <input id="task-name" name="task" type="text" />
                    <button>Add task</button>
                </form>
            </section>
        </main>
    </body>
</html>

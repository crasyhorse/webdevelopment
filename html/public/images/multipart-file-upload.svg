<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 735" role="img" aria-labelledby="title desc">
<title id="title">HTML file upload using multipart/form-data</title>
<desc id="desc">The browser submits a file selected in an HTML form with multipart/form-data encoding. A POST request contains a multipart body with a boundary and a file part, and is sent to a server.</desc>
<defs>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1478ce"/><stop offset="1" stop-color="#0c5ba5"/></linearGradient>
  <linearGradient id="purple" x2="1" y2="0"><stop stop-color="#7b57af"/><stop offset="1" stop-color="#684596"/></linearGradient>
  <linearGradient id="referenceBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1685e3"/><stop offset="1" stop-color="#1261ba"/></linearGradient>
  <linearGradient id="referenceBlueLight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6dcf9"/><stop offset="1" stop-color="#7fb7e8"/></linearGradient>
  <linearGradient id="referenceRequestBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2590f3"/><stop offset="1" stop-color="#0d67d0"/></linearGradient>
</defs>
<!-- Left browser form -->
<rect x="15" y="57" width="502" height="539" rx="26" fill="#fff" stroke="#0c3d78" stroke-width="5"/>
<path d="M41 57H491Q517 57 517 83V124H15V83Q15 57 41 57Z" fill="url(#blue)"/>
<circle cx="50" cy="93" r="11" fill="#ff625c"/><circle cx="82" cy="93" r="11" fill="#ffc338"/><circle cx="114" cy="93" r="11" fill="#63d16e"/>
<text x="285" y="104" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold">HTML form</text>
<text x="49" y="171" fill="#18334f" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Profile photo</text>
<rect x="45" y="191" width="441" height="76" rx="13" fill="#f9fbfd" stroke="#8e9cac" stroke-width="2.5"/>
<rect x="60" y="205" width="166" height="47" rx="9" fill="#e4edf6" stroke="#879cad" stroke-width="2"/>
<text x="143" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1a304a" font-weight="bold">Choose file</text>
<text x="240" y="236" font-family="Arial,sans-serif" font-size="21" fill="#192c44">profile-photo.png</text>
<rect x="159" y="312" width="207" height="70" rx="13" fill="#1776d2"/>
<text x="262" y="356" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold">Upload</text>
<!-- pointer and click -->
<path d="M349 355L349 418L366 400L383 435L397 427L377 396L406 396Z" fill="#fff" stroke="#122337" stroke-width="4.5" stroke-linejoin="round"/>
<path d="M387 311l8 -20M403 321l18 -11M405 337l21 0" stroke="#ffbf13" stroke-width="6" stroke-linecap="round"/>
<rect x="39" y="464" width="454" height="96" rx="12" fill="#eef1fb"/>
<text x="56" y="500" font-family="monospace" font-size="21" fill="#2e2778">&lt;form method=&quot;post&quot;</text>
<text x="56" y="530" font-family="monospace" font-size="21" fill="#2e2778">  enctype=&quot;multipart/form-data&quot;&gt;</text>
<text x="56" y="551" font-family="monospace" font-size="16" fill="#344963">&lt;input type=&quot;file&quot; name=&quot;avatar&quot;&gt;</text>
<!-- between arrows -->
<path d="M497 386H539V371L580 412L539 452V436H497Z" transform="translate(26 -82)" fill="#16a0f3" stroke="#082b52" stroke-width="6" stroke-linejoin="round"/>
<!-- multipart panel -->
<rect x="606" y="57" width="662" height="539" rx="26" fill="#fff" stroke="#6c4c9f" stroke-width="5"/>
<path d="M632 57H1242Q1268 57 1268 83V139H606V83Q606 57 632 57Z" fill="url(#purple)"/>
<text x="937" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#fff" font-weight="bold">multipart/form-data</text>
<rect x="631" y="157" width="613" height="69" rx="12" fill="#f1eafa"/>
<text x="652" y="183" font-family="Arial,sans-serif" font-size="20" fill="#56307e" font-weight="bold">Content-Type:</text>
<text x="652" y="211" font-family="monospace" font-size="20" fill="#261c40">multipart/form-data; boundary=abc123</text>
<rect x="631" y="243" width="613" height="326" rx="14" fill="#fbfbfe" stroke="#a297b6" stroke-width="2.5"/>
<g font-family="monospace" font-size="20" fill="#25283e">
 <text x="650" y="277">--abc123</text>
 <text x="650" y="318">Content-Disposition: form-data;</text>
 <text x="650" y="348">  name=&quot;avatar&quot;; filename=&quot;profile-photo.png&quot;</text>
 <text x="650" y="387">Content-Type: image/png</text>
 <text x="650" y="493">--abc123--</text>
</g>
<rect x="648" y="412" width="579" height="54" rx="9" fill="#e8e2f9"/>
<text x="667" y="447" font-family="monospace" font-style="italic" font-size="22" fill="#312452">...binary file content...</text>
<!-- to server -->
<path d="M1175 383H1211V366L1254 409L1211 452V435H1175Z" transform="translate(99 -80)" fill="#16a0f3" stroke="#082b52" stroke-width="6" stroke-linejoin="round"/>
<!-- server matching form-data-transfer.svg -->
<g transform="translate(468.8 9.6) scale(0.7)">
<g stroke="#082b52" stroke-width="7">
<rect x="1266" y="232" width="310" height="104" rx="32" fill="url(#referenceBlue)"/>
<rect x="1266" y="325" width="310" height="104" rx="28" fill="url(#referenceBlue)"/>
<rect x="1266" y="418" width="310" height="104" rx="28" fill="url(#referenceBlue)"/>
<path d="M1266 491H1576V582Q1576 615 1543 615H1299Q1266 615 1266 582Z" fill="url(#referenceBlueLight)"/>
<rect x="1303" y="615" width="42" height="20" rx="3" fill="#2377b5"/>
<rect x="1501" y="615" width="42" height="20" rx="3" fill="#2377b5"/>
</g>
<g stroke="#082b52" stroke-width="11" stroke-linecap="round">
<path d="M1308 284H1436M1308 377H1436M1308 470H1436"/>
</g>
<g fill="#8af554" stroke="#082b52" stroke-width="6"><circle cx="1524" cy="284" r="22"/><circle cx="1524" cy="377" r="22"/><circle cx="1524" cy="470" r="22"/></g>
<text x="1421" y="578" text-anchor="middle" fill="#082b52" font-family="Arial,sans-serif" font-size="51" font-weight="700">Server</text>
</g>

<!-- overall POST request arrow matching form-data-transfer.svg -->
<g transform="translate(0 87) scale(1 0.75)">
<path d="M65 758Q65 741 85 741H1483V718L1561 786L1483 847V821H85Q65 821 65 803Z" fill="url(#referenceRequestBlue)" stroke="#082b52" stroke-width="7" stroke-linejoin="round"/>
</g>
<text x="813" y="688" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">POST request</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">DOM tree compared with accessibility tree</title>
<desc id="desc">Left: HTML DOM with nav, link, main, section, heading, button . Right: accessibility tree with named navigation, link, main, named region, heading and button.</desc>
<defs><style>
.title{font:700 29px Arial,sans-serif;fill:#173748}.node{font:21px 'Courier New',monospace;fill:#173748}.small{font:18px Arial,sans-serif;fill:#456678}.hint{font:17px Arial,sans-serif;fill:#627b88}.pill{stroke:#64b7bd;stroke-width:2;fill:#e8f9f7}.ax{stroke:#589bc0;stroke-width:2;fill:#e8f2ff}.edge{stroke:#78939d;stroke-width:3;fill:none;stroke-linecap:round}.omit{fill:#fff0e7;stroke:#df8c6a;stroke-width:2;stroke-dasharray:5 5}
</style></defs>
<rect width="1200" height="570" fill="transparent"/>
<rect x="18" y="15" width="555" height="514" rx="22" fill="#f9fcfc" stroke="#bfdee0" stroke-width="3"/>
<rect x="627" y="15" width="555" height="514" rx="22" fill="#f9fbff" stroke="#bdd5ec" stroke-width="3"/>
<text class="title" x="295" y="62" text-anchor="middle">DOM tree</text>
<text class="title" x="904" y="62" text-anchor="middle">Accessibility tree</text>
<g class="edge"><path d="M80 119V146H116M80 146V267H116M145 185V212H178M145 306V334H178M208 369V392H237M208 369V455H237"/></g>
<g class="edge"><path d="M688 119V146H728M688 146V267H728M760 185V212H798M760 306V334H798M827 369V392H859"/></g>
<g>
<rect class="pill" x="44" y="90" width="150" height="40" rx="10"/><text class="node" x="59" y="117">&lt;body&gt;</text>
<rect class="pill" x="116" y="146" width="145" height="40" rx="10"/><text class="node" x="131" y="173">&lt;nav&gt;</text>
<rect class="pill" x="178" y="204" width="270" height="43" rx="10"/><text class="node" x="191" y="232">&lt;a&gt; Tasks</text>
<rect class="pill" x="116" y="267" width="150" height="40" rx="10"/><text class="node" x="132" y="294">&lt;main&gt;</text>
<rect class="pill" x="178" y="330" width="190" height="40" rx="10"/><text class="node" x="191" y="357">&lt;section&gt;</text>
<rect class="pill" x="237" y="390" width="270" height="41" rx="10"/><text class="node" x="250" y="418">&lt;h2&gt; Tasks</text>
<rect class="pill" x="237" y="448" width="285" height="43" rx="10"/><text class="node" x="247" y="476">&lt;button&gt; Add task</text>
</g>
<g>
<rect class="ax" x="661" y="90" width="170" height="40" rx="10"/><text class="node" x="676" y="117">document</text>
<rect class="ax" x="728" y="146" width="385" height="40" rx="10"/><text class="node" x="743" y="173">navigation “Main navigation”</text>
<rect class="ax" x="798" y="204" width="254" height="43" rx="10"/><text class="node" x="812" y="232">link “Tasks”</text>
<rect class="ax" x="728" y="267" width="160" height="40" rx="10"/><text class="node" x="743" y="294">main</text>
<rect class="ax" x="798" y="330" width="280" height="40" rx="10"/><text class="node" x="812" y="357">region “Tasks”</text>
<rect class="ax" x="859" y="390" width="294" height="41" rx="10"/><text class="node" x="870" y="418">heading “Tasks” (2)</text>
<rect class="ax" x="859" y="448" width="293" height="41" rx="10"/><text class="node" x="870" y="476">button “Add task”</text>
</g>
<text class="hint" x="40" y="555">Simplified example — not a one-to-one DOM mapping</text>
</svg>
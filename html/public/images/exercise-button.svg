<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Exercise button</title>
  <desc id="desc">A playful comic-style button with the word Exercise.</desc>

  <defs>
    <linearGradient id="fillMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56E2D0"/>
      <stop offset="55%" stop-color="#34D1C4"/>
      <stop offset="100%" stop-color="#25B9B5"/>
    </linearGradient>
    <linearGradient id="fillRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6333"/>
      <stop offset="100%" stop-color="#F03B1C"/>
    </linearGradient>
    <linearGradient id="fillShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1C2E"/>
      <stop offset="100%" stop-color="#1D2C47"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.8" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Base shadow layers -->
  <path d="M86 61 C61 63 46 81 47 100 L49 233 C49 256 68 272 97 271 L1107 270 C1137 270 1155 254 1156 233 L1158 101 C1158 80 1141 63 1112 61 Z" fill="#000000" opacity="0.22" filter="url(#softBlur)"/>
  <path d="M79 72 C56 74 42 91 43 107 L45 245 C45 267 64 283 92 283 L1105 283 C1133 283 1150 266 1151 244 L1154 108 C1154 90 1138 74 1111 72 Z" fill="url(#fillShadow)"/>
  <path d="M64 226 C63 256 82 274 111 274 L1090 274 C1120 274 1137 259 1137 230 L1138 210 C1138 204 1131 200 1122 200 L83 200 C72 200 66 205 65 214 Z" fill="url(#fillRim)"/>

  <!-- Main badge -->
  <path d="M68 53 C47 56 32 73 33 92 L35 219 C35 242 54 258 82 258 L1098 257 C1128 257 1146 241 1147 219 L1149 92 C1149 73 1133 56 1104 54 L87 52 C79 52 73 52 68 53 Z" fill="url(#fillMain)" stroke="#173748" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Texture / highlights -->
  <path d="M86 69 C131 60 236 57 403 64" fill="none" stroke="#B8FFF2" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M882 66 C962 60 1045 60 1101 66" fill="none" stroke="#B8FFF2" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
  <path d="M114 93 C179 52 264 41 400 41 C427 41 437 69 420 79 C378 104 260 104 156 127 C111 137 89 118 95 104 C98 99 103 95 114 93 Z" fill="#FFFFFF" opacity="0.82"/>
  <ellipse cx="146" cy="116" rx="20" ry="12" transform="rotate(-38 146 116)" fill="#FFFFFF" opacity="0.88"/>

  <g opacity="0.62">
    <path d="M89 183 h220 v62 h-220 z" fill="url(#dots)"/>
    <path d="M905 85 h180 v86 h-180 z" fill="url(#dots)"/>
  </g>

  <!-- Comic accents -->
  <g fill="#FFF5B8" stroke="#173748" stroke-width="6" stroke-linejoin="round" opacity="0.95">
    <path d="M112 164 L161 141 L174 186 Z"/>
    <path d="M94 210 L96 177 L176 183 L173 215 Z"/>
    <path d="M1082 161 L1034 140 L1020 186 Z"/>
    <path d="M1098 208 L1097 176 L1017 183 L1020 214 Z"/>
  </g>

  <!-- Text shadow -->
  <text x="603" y="187" text-anchor="middle" font-family="'Comic Sans MS','Trebuchet MS',system-ui,sans-serif" font-size="132" font-weight="900" letter-spacing="-2" fill="#127A87" opacity="0.5" transform="translate(6 8)">Exercise</text>
  <!-- Main text -->
  <text x="603" y="187" text-anchor="middle" font-family="'Comic Sans MS','Trebuchet MS',system-ui,sans-serif" font-size="132" font-weight="900" letter-spacing="-2" fill="#FFFFFF" stroke="#173748" stroke-width="4.4" stroke-linejoin="round" paint-order="stroke">Exercise</text>

  <!-- Tiny doodle accents -->
  <path d="M216 82 l14 -6" stroke="#1B6273" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M975 230 l-12 6" stroke="#1B6273" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
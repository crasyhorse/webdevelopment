<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">HTML button rendered as a graphical button</title>
  <desc id="desc">HTML code button Save button, a turquoise arrow, and a blue Save button.</desc>
  <defs>
    <linearGradient id="buttonBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa7e7"/>
      <stop offset="100%" stop-color="#2478c4"/>
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="5" dy="7" stdDeviation="4" flood-color="#263b4c" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="43" letter-spacing="-1.3">
    <text x="48" y="226" xml:space="preserve"><tspan fill="#12649a">&lt;button&gt;</tspan><tspan fill="#1d2939">Save</tspan><tspan fill="#12649a">&lt;/button&gt;</tspan></text>
  </g>
  <path d="M654 191 L709 191 L709 170 L765 210 L709 250 L709 229 L654 229 Z" fill="#17c5b6" stroke="#1b2b35" stroke-width="5" stroke-linejoin="round"/>
  <g filter="url(#buttonShadow)">
    <rect x="830" y="163" width="260" height="95" rx="26" fill="url(#buttonBlue)" stroke="#17304b" stroke-width="4"/>
    <path d="M853 177 H1066" stroke="#bde8ff" stroke-width="3" stroke-linecap="round" opacity="0.58"/>
    <text x="960" y="226" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle" fill="#ffffff">Save</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">From HTML source to a DOM tree</title>
<desc id="desc">A comic-style HTML code sheet enters a cheerful HTML parser robot, which produces a DOM tree with main as the root, h1 and button child elements, and their text nodes Tasks and Save.</desc>
<defs>
  <filter id="shadow" x="-30%" y="-40%" width="180%" height="200%"><feDropShadow dx="5" dy="9" stdDeviation="6" flood-color="#17354b" flood-opacity=".14"/></filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#13bfae" stroke="#1c3444" stroke-width="1.3" stroke-linejoin="round"/></marker>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c6f7fc"/><stop offset="1" stop-color="#58b7d3"/></linearGradient>
  <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4feff"/><stop offset="1" stop-color="#d8f6f6"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<!-- subtle ground line -->
<path d="M70 735 Q550 743 805 736 T1532 733" fill="none" stroke="#dcecf0" stroke-width="5" stroke-linecap="round"/>
<!-- LEFT: source sheet -->
<g filter="url(#shadow)" transform="translate(70 220) rotate(-3 230 220)">
  <path d="M12 0 H443 Q460 0 460 18 V465 Q460 485 441 485 H20 Q0 485 0 466 V22 Q0 0 12 0" fill="#f9fcfd" stroke="#1b3445" stroke-width="6"/>
  <path d="M0 22 Q0 0 22 0 H439 Q460 0 460 22 V80 H0Z" fill="#daf4f7" stroke="#1b3445" stroke-width="5"/>
  <circle cx="35" cy="41" r="10" fill="#fb8d87" stroke="#17364a" stroke-width="3"/>
  <circle cx="67" cy="41" r="10" fill="#ffcb72" stroke="#17364a" stroke-width="3"/>
  <circle cx="99" cy="41" r="10" fill="#65cdb5" stroke="#17364a" stroke-width="3"/>
  <text x="237" y="51" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#27516a">HTML source</text>
  <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="25" fill="#246e9d">
    <text x="30" y="150">&lt;main&gt;</text>
    <text x="49" y="213">&lt;h1&gt;<tspan fill="#263743">Tasks</tspan>&lt;/h1&gt;</text>
    <text x="49" y="276" font-size="22">&lt;button&gt;<tspan fill="#263743">Save</tspan>&lt;/button&gt;</text>
    <text x="30" y="339">&lt;/main&gt;</text>
  </g>
  <path d="M45 391 Q202 376 410 395" fill="none" stroke="#a7d9e3" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 15"/>
  <path d="M40 436 L143 436" stroke="#a7d9e3" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- flowing arrow into parser -->
<path d="M533 456 C567 448 578 441 613 441" fill="none" stroke="#1b3445" stroke-width="20" stroke-linecap="round"/>
<path d="M533 456 C567 448 578 441 613 441" fill="none" stroke="#13bfae" stroke-width="14" stroke-linecap="round" marker-end="url(#arrow)"/>
<!-- parser machine wheels/feet -->
<g stroke="#1b3445" stroke-width="6" stroke-linejoin="round">
  <path d="M680 668 L669 724 L720 724 L742 670" fill="#356781"/>
  <path d="M860 668 L878 724 L923 724 L912 665" fill="#356781"/>
</g>
<!-- robot arms -->
<g fill="none" stroke="#19384c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
  <path d="M675 431 Q619 405 602 376 L586 382"/>
  <path d="M916 439 Q959 393 977 372"/>
</g>
<g fill="#6ed9df" stroke="#19384c" stroke-width="5" stroke-linejoin="round">
  <path d="M578 369 l-12 -18 8 -17 16 16 7 -20 13 10 -6 30Z"/>
  <path d="M965 369 l3 -23 13 0 9 19 12 -12 9 14 -22 22Z"/>
</g>
<!-- machine body -->
<g filter="url(#shadow)">
  <rect x="650" y="330" width="286" height="360" rx="53" fill="url(#metal)" stroke="#19384c" stroke-width="8"/>
  <rect x="673" y="376" width="242" height="220" rx="32" fill="url(#screen)" stroke="#1b3445" stroke-width="6"/>
</g>
<!-- antenna -->
<path d="M793 333 L793 283" stroke="#1b3445" stroke-width="9" stroke-linecap="round"/>
<circle cx="793" cy="270" r="20" fill="#ffc869" stroke="#1b3445" stroke-width="6"/>
<!-- glasses -->
<g stroke="#1b3445" stroke-width="7" fill="none"><circle cx="740" cy="455" r="37"/><circle cx="846" cy="455" r="37"/><path d="M777 455 Q791 447 808 455 M700 448 L679 442 M885 448 L913 442"/></g>
<g fill="#172f43"><circle cx="742" cy="455" r="12"/><circle cx="844" cy="455" r="12"/></g>
<circle cx="699" cy="520" r="15" fill="#f5a1a5" opacity=".8"/><circle cx="883" cy="520" r="15" fill="#f5a1a5" opacity=".8"/>
<path d="M754 521 Q793 567 836 518" fill="none" stroke="#17364a" stroke-width="8" stroke-linecap="round"/>
<path d="M748 606 H837" stroke="#1b3445" stroke-width="7" stroke-linecap="round"/>
<g transform="rotate(-2 793 624)"><rect x="692" y="619" width="202" height="45" rx="18" fill="#0e7f96" stroke="#19384c" stroke-width="5"/><text x="793" y="650" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="white" text-anchor="middle">HTML Parser</text></g>
<!-- funny action marks -->
<g fill="none" stroke="#f1b949" stroke-width="8" stroke-linecap="round"><path d="M690 281 l-15 -22 M715 259 l-3 -23 M880 286 l23 -24"/></g>
<!-- arrow from parser to DOM -->
<path d="M948 488 Q990 468 1019 470" fill="none" stroke="#19384c" stroke-width="19" stroke-linecap="round"/>
<path d="M948 488 Q990 468 1019 470" fill="none" stroke="#13bfae" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
<!-- DOM tree right side -->
<g transform="translate(1036 180)">
  <text x="250" y="30" font-family="'Trebuchet MS',Arial,sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#183c4d">DOM tree</text>
  <!-- branches behind cards -->
  <g fill="none" stroke="#2c8f70" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 173 V217 Q252 235 229 235 H126 V273"/>
    <path d="M252 217 Q252 235 279 235 H388 V273"/>
    <path d="M126 365 V408"/>
    <path d="M388 365 V408"/>
  </g>
  <!-- leaves decorate branches -->
  <g fill="#8cdba3" stroke="#2d9474" stroke-width="3"><ellipse cx="197" cy="234" rx="18" ry="9" transform="rotate(30 197 234)"/><ellipse cx="327" cy="238" rx="18" ry="9" transform="rotate(-30 327 238)"/><ellipse cx="134" cy="401" rx="13" ry="7" transform="rotate(34 134 401)"/><ellipse cx="376" cy="399" rx="13" ry="7" transform="rotate(-25 376 399)"/></g>
  <g filter="url(#shadow)" stroke="#1a3a48" stroke-width="5">
    <rect x="145" y="94" width="215" height="84" rx="24" fill="#87dcbc"/>
    <rect x="33" y="276" width="187" height="85" rx="22" fill="#c3f3df"/>
    <rect x="294" y="276" width="195" height="85" rx="22" fill="#c3f3df"/>
    <rect x="33" y="411" width="187" height="76" rx="25" fill="#fff6d8"/>
    <rect x="294" y="411" width="195" height="76" rx="25" fill="#fff6d8"/>
  </g>
  <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="700" fill="#173b44" text-anchor="middle">
    <text x="252" y="148" font-size="36">main</text>
    <text x="126" y="332" font-size="32">h1</text>
    <text x="392" y="332" font-size="29">button</text>
    <text x="126" y="459" font-size="29">Tasks</text>
    <text x="392" y="459" font-size="29">Save</text>
  </g>
  <text x="126" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5a7481">text node</text>
  <text x="392" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5a7481">text node</text>
</g>
<!-- tiny comic sparkles -->
<g stroke="#f5c15c" fill="none" stroke-width="6" stroke-linecap="round"><path d="M1036 328 l-9 -21 M1054 314 l5 -23 M1494 354 l12 -22"/></g>
</svg>

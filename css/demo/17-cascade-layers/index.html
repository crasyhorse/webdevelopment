<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Layers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="task-manager">
    <header class="task-manager__header">
      <h1 class="task-manager__title">Task Manager</h1>
    </header>
    <section class="task-manager__theme" aria-labelledby="theme-title">
      <h2 id="theme-title" class="task-manager__section-title">Theme experiment</h2>
      <p class="task-manager__note">
        The heading below is styled by two rules. Only one can win —
        open DevTools and find out which one, and why.
      </p>
      <h2 id="special-heading" class="panel__title">Weekly report</h2>
      <ul class="task-list">
        <li class="task-list__item">Review pull request</li>
        <li class="task-list__item task-list__item--highlight">Ship the demo</li>
      </ul>
    </section>
  </main>
</body>
</html>

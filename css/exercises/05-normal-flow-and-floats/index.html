<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager — Floats Exercise</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="task-manager">
    <h1>Task Manager</h1>

    <article class="task-card" aria-labelledby="task-title">
      <div class="task-card__icon" aria-hidden="true">✓</div>
      <p class="task-card__description" id="task-title">Review the pull request</p>
      <button class="task-card__action" type="button">Mark as done</button>
    </article>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Manager</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="task-header">
            <h1 class="task-title">Task Manager</h1>
            <p>Manage your tasks in one place.</p>
            <nav aria-label="Main navigation">
                <a href="#tasks">Tasks</a>
            </nav>
        </header>

        <main class="task-main">
            <section id="tasks" data-view="active" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading">Tasks</h2>

                <ul class="task-list">
                    <li class="task-item">Learn HTML document structure</li>
                    <li class="task-item">Review semantic HTML</li>
                </ul>

                <form action="" method="get">
                    <label for="task-name">New task</label>
                    <p id="task-help">Enter a short description of the task.</p>
                    <input id="task-name" name="task" type="text" aria-describedby="task-help" required minlength="3" maxlength="80" />
                    <div>
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" name="priority">
                            <option value="low">Low</option>
                            <option value="normal" selected>Normal</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <label for="task-due">Due date (optional)</label>
                    <input id="task-due" name="due" type="date" />
                    <button class="submit-button" type="submit">Add task</button>
                </form>
            </section>
        </main>
    </body>
</html>

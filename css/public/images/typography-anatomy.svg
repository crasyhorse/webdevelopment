<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 260" role="img">
  <title>Typeface anatomy — schematic Latin glyph metrics</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .label {
      font-size: 20px;
    }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
<title id="title">Fixed width versus percentage width</title><desc id="desc">Two 400px containers: a fixed 300px box and a 50 percent width box equivalent to 200px.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1c344e; }
.label { font-size: 25px; font-weight: 700; }
.note { font-size: 19px; }
.small { font-size: 17px; }
.content { fill: #a8c8d9; stroke: #4c7186; stroke-width: 3; }
.frame { fill: #fff; stroke: #345b83; stroke-width: 4; }
.dim { stroke: #214c75; stroke-width: 3; }
</style>
<rect width="760" height="470" rx="14" fill="#f3f6f9"/>
<text x="380" y="53" text-anchor="middle" class="label">Both containers are 400px wide</text>
<rect x="68" y="84" width="624" height="116" rx="6" class="frame"/>
<rect x="68" y="84" width="468" height="116" rx="5" class="content"/>
<text x="300" y="150" text-anchor="middle" class="label">width: 300px</text>
<text x="710" y="149" text-anchor="middle" class="small"> </text>
<rect x="68" y="240" width="624" height="116" rx="6" class="frame"/>
<rect x="68" y="240" width="312" height="116" rx="5" fill="#c8d59a" stroke="#6c7d2c" stroke-width="3"/>
<text x="220" y="306" text-anchor="middle" class="label">50% = 200px</text>
<text x="380" y="407" text-anchor="middle" class="note">300px stays fixed · 50% depends on container width</text>
</svg>
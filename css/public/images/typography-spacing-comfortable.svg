<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 206" role="img">
  <title>Typography Spacing Comfortable</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .detail { font-size: 16px; fill: #526B80; }
    .code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 17px; }
  </style>
  <rect x="8" y="8" width="400" height="190" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="2" />
  <text x="24" y="36" class="code" >line-height: 1.5</text>
  <text x="24" y="76" class="" style="font-size: 24px;">Readable text helps users</text>
  <text x="24" y="112" class="" style="font-size: 24px;">understand information</text>
  <text x="24" y="148" class="" style="font-size: 24px;">and complete their tasks.</text>

</svg>

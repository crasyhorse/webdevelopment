<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="585" viewBox="0 0 1400 585" role="img" aria-labelledby="t d">
<title id="t">Different browser default stylesheets</title><desc id="d">One semantic HTML document leads to three browser user-agent stylesheets. All provide defaults for margin, heading size, links, and controls, but exact results can differ.</desc>
<defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203451" flood-opacity=".13"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526a86"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243e5d}.hd{font-size:26px;font-weight:700}.code{font-family:monospace;font-size:20px}.body{font-size:21px}.minor{font-size:17px;fill:#5f7289}.flow{fill:none;stroke:#526a86;stroke-width:3;stroke-dasharray:7 7;stroke-linecap:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#b6c8dc;stroke-width:2.5}.browser{font-size:23px;font-weight:700}</style>
<g filter="url(#shadow)"><rect x="425" y="8" width="550" height="91" rx="17" class="card"/><rect x="425" y="8" width="550" height="37" rx="17" fill="#e2eef9"/><text x="700" y="37" text-anchor="middle" class="hd">Same HTML document</text><text x="700" y="76" text-anchor="middle" class="code">&lt;h1&gt;Tasks&lt;/h1&gt; &lt;p&gt;Hello&lt;/p&gt;</text></g>
<path d="M700 101 C695 149 244 125 244 190" class="flow"/><path d="M700 101 C700 144 700 147 700 190" class="flow"/><path d="M700 101 C705 149 1156 125 1156 190" class="flow"/>
<g filter="url(#shadow)">
<g transform="translate(41 190)"><rect width="405" height="305" rx="18" class="card"/><rect width="405" height="55" rx="18" fill="#d5e8fa"/><circle cx="29" cy="27" r="12" fill="#4c91d0"/><text x="53" y="35" class="browser">Browser A</text><rect x="20" y="70" width="365" height="54" rx="12" fill="#eff5fd"/><text x="40" y="104" class="hd">User-agent stylesheet</text><text x="30" y="160" class="body">• default margins</text><text x="30" y="202" class="body">• heading sizes</text><text x="30" y="244" class="body">• link appearance</text><text x="30" y="286" class="body">• native controls</text></g>
<g transform="translate(498 190)"><rect width="405" height="305" rx="18" class="card"/><rect width="405" height="55" rx="18" fill="#fae4d5"/><circle cx="29" cy="27" r="12" fill="#ea9055"/><text x="53" y="35" class="browser">Browser B</text><rect x="20" y="70" width="365" height="54" rx="12" fill="#fff4ea"/><text x="40" y="104" class="hd">User-agent stylesheet</text><text x="30" y="160" class="body">• default margins</text><text x="30" y="202" class="body">• heading sizes</text><text x="30" y="244" class="body">• link appearance</text><text x="30" y="286" class="body">• native controls</text></g>
<g transform="translate(955 190)"><rect width="405" height="305" rx="18" class="card"/><rect width="405" height="55" rx="18" fill="#e1f1de"/><circle cx="29" cy="27" r="12" fill="#72b96a"/><text x="53" y="35" class="browser">Browser C</text><rect x="20" y="70" width="365" height="54" rx="12" fill="#f0faed"/><text x="40" y="104" class="hd">User-agent stylesheet</text><text x="30" y="160" class="body">• default margins</text><text x="30" y="202" class="body">• heading sizes</text><text x="30" y="244" class="body">• link appearance</text><text x="30" y="286" class="body">• native controls</text></g>
</g>
<path d="M330 510 Q702 522 1080 510" fill="none" stroke="#96aabc" stroke-width="2.5" stroke-dasharray="7 7"/><text x="700" y="557" text-anchor="middle" font-size="22" font-style="italic">Schematic: specific defaults may vary by browser and platform</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">How minimum and maximum size constraints work</title>
  <desc id="desc">Three scenarios show size constraints: width 100 percent fills a narrow parent, max-width caps the card in a wide parent, and min-height creates a minimum height that content can exceed.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
    }
    .small {
      font-size: 17px;
    }
    .label {
      font-size: 18px;
      font-weight: 700;
    }
    .panel {
      fill: #FAFBFC;
      stroke: #CAD5E0;
      stroke-width: 2;
    }
    .parent {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 8 6;
    }
    .card {
      fill: #ffffff;
      stroke: #4C7186;
      stroke-width: 2.5;
    }
    .content {
      fill: #526B80;
      font-size: 15px;
    }
    .measure {
      fill: #263C55;
      font-size: 16px;
      font-weight: 700;
    }
    .measure2 {
      fill: #263C55;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
  <rect width="960" height="620" fill="#FAFBFC"/>
  <rect x="20" y="20" width="920" height="580" rx="20" class="panel"/>
  <!-- Scenario 1 -->
  <text x="160" y="60" text-anchor="middle" class="title">1. Narrow parent</text>
  <text x="160" y="88" text-anchor="middle" class="small"><tspan font-family="DejaVu Sans Mono, Consolas, monospace">width: 100%</tspan> fills the parent</text>
  <rect x="55" y="120" width="210" height="300" rx="10" class="parent"/>
  <text x="160" y="144" text-anchor="middle" class="small">Parent</text>
  <rect x="75" y="165" width="170" height="160" rx="10" class="card"/>
  <text x="160" y="200" text-anchor="middle" class="label">Task card</text>
  <text x="160" y="227" text-anchor="middle" class="content" style="font-family:DejaVu Sans Mono, Consolas, monospace;">width: 100%</text>
  <text x="160" y="250" text-anchor="middle" class="content" style="font-family:DejaVu Sans Mono, Consolas, monospace;">max-width: 42rem</text>
  <text x="160" y="273" text-anchor="middle" class="content" style="font-family:DejaVu Sans Mono, Consolas, monospace;">min-height: 10rem</text>
  <line x1="75" y1="345" x2="245" y2="345" stroke="#263C55" stroke-width="2"/>
  <line x1="75" y1="338" x2="75" y2="352" stroke="#263C55" stroke-width="2"/>
  <line x1="245" y1="338" x2="245" y2="352" stroke="#263C55" stroke-width="2"/>
  <text x="160" y="370" text-anchor="middle" class="measure">Fills the available width</text>
  <!-- Scenario 2 -->
  <text x="480" y="60" text-anchor="middle" class="title">2. Wide parent</text>
  <text x="480" y="88" text-anchor="middle" class="small"><tspan font-family="DejaVu Sans Mono, Consolas, monospace">max-width</tspan> stops growth</text>
  <rect x="320" y="120" width="320" height="300" rx="10" class="parent"/>
  <text x="480" y="144" text-anchor="middle" class="small">Wider parent</text>
  <rect x="362" y="165" width="236" height="160" rx="10" class="card"/>
  <text x="480" y="200" text-anchor="middle" class="label">Task card</text>
  <text x="480" y="227" text-anchor="middle" class="content" style="font-family:DejaVu Sans Mono, Consolas, monospace;">width: 100%</text>
  <text x="480" y="250" text-anchor="middle" class="content" style="font-family:DejaVu Sans Mono, Consolas, monospace;">max-width: 42rem</text>
  <line x1="362" y1="345" x2="598" y2="345" stroke="#263C55" stroke-width="2"/>
  <line x1="362" y1="338" x2="362" y2="352" stroke="#263C55" stroke-width="2"/>
  <line x1="598" y1="338" x2="598" y2="352" stroke="#263C55" stroke-width="2"/>
  <text x="480" y="370" text-anchor="middle" class="measure2">Growth stops at max-width</text>
  <!-- Scenario 3 -->
  <text x="790" y="60" text-anchor="middle" class="title">3. Height floor</text>
  <text x="790" y="88" text-anchor="middle" style="font-size:14px">Minimum, not maximum</text>
  <rect x="690" y="120" width="200" height="300" rx="10" class="parent"/>
  <text x="753" y="150" text-anchor="middle" style="font-size:14px">Short</text>
  <rect x="718" y="165" width="70" height="160" rx="10" class="card"/>
  <text x="753" y="225" text-anchor="middle" class="small" style="font-family:DejaVu Sans Mono, Consolas, monospace;">10rem</text>
  <text x="843" y="150" text-anchor="middle" style="font-size:14px">Long</text>
  <rect x="808" y="165" width="70" height="210" rx="10" class="card"/>
  <text x="843" y="230" text-anchor="middle" class="small" style="font-family:DejaVu Sans Mono, Consolas, monospace;">10rem</text>
  <text x="843" y="255" text-anchor="middle" style="font-size:13px">+ text</text>
  <text x="790" y="398" text-anchor="middle" style="font-size:14px;fill:#263C55;font-weight:700">Grows with content</text>
  <text x="480" y="550" text-anchor="middle" class="small">width: 100% uses the parent's width, max-width caps it, and min-height only sets a floor.</text>
</svg>

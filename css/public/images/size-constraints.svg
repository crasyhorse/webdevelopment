<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
<title id="title">Responsive box constraints</title><desc id="desc">A narrow card fills its containing block; on a wide screen it stops at the maximum width. Minimum height is a floor that permits growth.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1c344e; }
.label { font-size: 25px; font-weight: 700; }
.note { font-size: 19px; }
.small { font-size: 17px; }
.content { fill: #a8c8d9; stroke: #4c7186; stroke-width: 3; }
.frame { fill: #fff; stroke: #345b83; stroke-width: 4; }
.dim { stroke: #214c75; stroke-width: 3; }
</style>
<rect width="760" height="470" rx="14" fill="#f3f6f9"/>
<text x="380" y="48" text-anchor="middle" class="label">Flexible width, maximum limit</text>
<text x="57" y="100" class="note">Narrow container</text>
<rect x="55" y="123" width="258" height="115" rx="8" fill="#fdfefe" stroke="#93a4b5" stroke-width="3"/>
<rect x="62" y="131" width="244" height="99" rx="6" class="content"/>
<text x="184" y="180" text-anchor="middle" class="note">width: 100%</text>
<text x="184" y="208" text-anchor="middle" class="small">fills container</text>
<text x="353" y="100" class="note">Wide container</text>
<rect x="349" y="123" width="359" height="115" rx="8" fill="#fdfefe" stroke="#93a4b5" stroke-width="3"/>
<rect x="356" y="131" width="276" height="99" rx="6" fill="#c8d59a" stroke="#6c7d2c" stroke-width="3"/>
<text x="493" y="178" text-anchor="middle" class="note">max-width: 42rem</text>
<text x="493" y="207" text-anchor="middle" class="small">stops growing</text>
<rect x="100" y="285" width="560" height="136" rx="8" class="frame"/>
<rect x="112" y="296" width="536" height="95" rx="6" class="content"/>
<text x="380" y="339" text-anchor="middle" class="label">min-height: 10rem</text>
<text x="380" y="374" text-anchor="middle" class="note">can grow taller for content</text>
</svg>
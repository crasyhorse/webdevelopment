<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" role="img" aria-labelledby="title desc">
  <title id="title">Container query threshold</title>
  <desc id="desc">At a named ancestor content width of 20rem, the card uses the base column direction. At 30rem, the 25rem condition matches and its card uses row direction. The same two child items appear in both. Schematic comparison.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #263C55;
    }
    .heading {
      font-size: 22px;
      font-weight: 700;
    }
    .annotation {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
    .frame {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
    .blue {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 2;
    }
    .green {
      fill: #C8D59A;
      stroke: #6C7D2C;
      stroke-width: 2;
    }
    .orange {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
    }
  </style>
  <text x="103" y="22" text-anchor="middle" class="code heading">20rem</text>
  <text x="377" y="22" text-anchor="middle" class="code heading">30rem</text>
  <text x="103" y="46" text-anchor="middle" class="annotation">Query does not match</text>
  <text x="377" y="46" text-anchor="middle" class="annotation">Query matches</text>
  <rect x="3" y="59" width="200" height="155" rx="5" class="frame" />
  <rect x="227" y="59" width="300" height="155" rx="5" class="frame" />
  <text x="103" y="81" text-anchor="middle" class="code annotation">tasks</text>
  <text x="377" y="81" text-anchor="middle" class="code annotation">tasks</text>
  <rect x="11" y="91" width="184" height="113" rx="4" fill="#FAFBFC" stroke="#8095AA" stroke-width="2" />
  <rect x="235" y="91" width="284" height="113" rx="4" fill="#FAFBFC" stroke="#8095AA" stroke-width="2" />
  <rect x="19" y="99" width="168" height="44" rx="4" class="blue" />
  <text x="103" y="127" text-anchor="middle">A</text>
  <rect x="19" y="148" width="168" height="44" rx="4" class="green" />
  <text x="103" y="176" text-anchor="middle">B</text>
  <rect x="243" y="99" width="131.5" height="97" rx="4" class="blue" />
  <text x="308.75" y="153" text-anchor="middle">A</text>
  <rect x="379.5" y="99" width="131.5" height="97" rx="4" class="green" />
  <text x="445.25" y="153" text-anchor="middle">B</text>
  <text x="103" y="238" text-anchor="middle" class="code">column</text>
  <text x="377" y="238" text-anchor="middle" class="code">row</text>
  <text x="268" y="263" text-anchor="middle" class="annotation">Dashed frame = named query container</text>
</svg>

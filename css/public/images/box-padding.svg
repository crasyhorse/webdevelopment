<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .lbl {
      font-size: 28px;
      font-weight: 700;
    }
    .note {
      font-size: 23px;
    }
    .small {
      font-size: 19px;
    }
    .card {
      fill: #FAFBFC;
      stroke: #526B80;
      stroke-width: 5;
    }
    .content {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 3;
    }
    .padding {
      fill: #C8D59A;
    }
    .border {
      fill: #E7D89B;
      stroke: #8C7428;
      stroke-width: 3;
    }
    .margin {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
      stroke-dasharray: 9 7;
    }
  </style>
  <rect width="900" height="560" fill="#F3F6F9"/>
  <rect x="20" y="20" width="860" height="520" rx="18" fill="#fff" stroke="#CAD5E0" stroke-width="2"/>
  <title id="title">Padding around task card content</title>
  <desc id="desc">Green padding lies between blue content and the ocher border of a task card.</desc>
  <text x="450" y="83" text-anchor="middle" class="lbl">Padding — inner space</text>
  <rect x="148" y="132" width="604" height="292" rx="10" class="border"/>
  <rect x="157" y="141" width="586" height="274" rx="5" class="padding"/>
  <rect x="230" y="213" width="440" height="130" rx="6" class="content"/>
  <text x="450" y="286" text-anchor="middle" class="lbl">Review the pull request</text>
  <text x="450" y="179" text-anchor="middle" class="lbl" style="fill:#263C55">Padding</text>
</svg>

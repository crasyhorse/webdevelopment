<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="1400" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Exercise illustration</title>
  <desc id="desc">Comic-style vector illustration of a coding exercise with a laptop, checklist, and pencil.</desc>
  <defs>
    <linearGradient id="laptopBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ED7D0"/>
      <stop offset="100%" stop-color="#249BB2"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="100%" stop-color="#EAF4FC"/>
    </linearGradient>
    <linearGradient id="bannerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52E1D0"/>
      <stop offset="100%" stop-color="#30C1C1"/>
    </linearGradient>
    <linearGradient id="shadowFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102036"/>
      <stop offset="100%" stop-color="#1C3556"/>
    </linearGradient>
    <linearGradient id="orangeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDB63"/>
      <stop offset="100%" stop-color="#FF9B29"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F4FA"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1020" flood-opacity="0.18"/>
    </filter>
    <style>
      .thick { stroke:#173748; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .med { stroke:#173748; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#406F82; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .code { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill:#20465A; }
      .bannerText { font-family: 'Comic Sans MS','Trebuchet MS',system-ui,sans-serif; font-size: 110px; font-weight: 900; letter-spacing: -2px; }
    </style>
  </defs>

  <!-- laptop shadow -->
  <ellipse cx="474" cy="372" rx="303" ry="28" fill="#0E1628" opacity="0.12"/>
  <!-- checklist shadow -->
  <ellipse cx="1098" cy="348" rx="128" ry="23" fill="#0E1628" opacity="0.10"/>

  <!-- laptop -->
  <g filter="url(#softShadow)">
    <rect x="180" y="86" width="610" height="260" rx="26" fill="url(#laptopBlue)" class="thick"/>
    <rect x="209" y="113" width="552" height="205" rx="18" fill="url(#screenFill)" class="med"/>
    <rect x="436" y="96" width="80" height="10" rx="5" fill="#B8FFF2" opacity="0.8"/>

    <!-- html code on screen -->
    <rect x="232" y="136" width="103" height="26" rx="13" fill="#E6F8F5"/>
    <text x="245" y="155" class="code" fill="#178A90">&lt;body&gt;</text>

    <text x="262" y="196" class="code" fill="#2474C2">&lt;h1&gt;</text>
    <text x="352" y="196" class="code" fill="#FF8A00">Task Manager</text>
    <text x="535" y="196" class="code" fill="#2474C2">&lt;/h1&gt;</text>

    <text x="262" y="230" class="code" fill="#2474C2">&lt;p&gt;</text>
    <text x="324" y="230" class="code" fill="#455A70">Practice HTML structure</text>
    <text x="652" y="230" class="code" fill="#2474C2">&lt;/p&gt;</text>

    <text x="262" y="264" class="code" fill="#2474C2">&lt;button&gt;</text>
    <text x="390" y="264" class="code" fill="#1E8772">Add task</text>
    <text x="513" y="264" class="code" fill="#2474C2">&lt;/button&gt;</text>

    <text x="245" y="302" class="code" fill="#178A90">&lt;/body&gt;</text>

    <!-- base -->
    <path d="M150 348 L820 348 L766 385 Q756 392 736 392 L223 392 Q198 392 189 385 Z" fill="url(#shadowFill)" class="thick"/>
    <rect x="442" y="360" width="74" height="8" rx="4" fill="#A2B5C8" opacity="0.75"/>
  </g>

  <!-- big pencil -->
  <g transform="translate(770 255) rotate(-24) scale(0.78)" filter="url(#softShadow)">
    <rect x="0" y="-22" width="220" height="44" rx="22" fill="url(#orangeFill)" class="thick"/>
    <rect x="15" y="-22" width="18" height="44" fill="#F6C74B" opacity="0.7"/>
    <rect x="33" y="-22" width="14" height="44" fill="#F4B13A" opacity="0.65"/>
    <polygon points="220,-22 263,0 220,22" fill="#F7E2BA" class="thick"/>
    <polygon points="245,-9 263,0 245,9" fill="#173748"/>
    <rect x="-22" y="-22" width="26" height="44" rx="10" fill="#FF6B87" class="thick"/>
    <rect x="-4" y="-22" width="8" height="44" fill="#FFE7EF" opacity="0.7"/>
  </g>

  <!-- checklist card -->
  <g filter="url(#softShadow)">
    <rect x="942" y="112" width="258" height="208" rx="22" fill="url(#paperFill)" class="thick"/>
    <rect x="969" y="96" width="88" height="24" rx="12" fill="#FFB43E" class="med"/>
    <text x="1082" y="155" text-anchor="middle" class="label" fill="#173748">Checklist</text>

    <!-- items -->
    <circle cx="989" cy="190" r="17" fill="#52E1D0" class="med"/>
    <path d="M981 189 l7 8 l14 -18" fill="none" class="med"/>
    <rect x="1018" y="178" width="140" height="16" rx="8" fill="#A7BCD0"/>

    <circle cx="989" cy="230" r="17" fill="#52E1D0" class="med"/>
    <path d="M981 229 l7 8 l14 -18" fill="none" class="med"/>
    <rect x="1018" y="218" width="118" height="16" rx="8" fill="#A7BCD0"/>

    <circle cx="989" cy="270" r="17" fill="#FFF3C7" class="med"/>
    <rect x="1018" y="258" width="128" height="16" rx="8" fill="#A7BCD0"/>
  </g>

  <!-- comic burst accents -->
  <g opacity="0.95">
    <path d="M872 64 l18 -28" class="med" fill="none" stroke="#FF9B29"/>
    <path d="M919 73 l38 -18" class="med" fill="none" stroke="#FF9B29"/>
    <path d="M945 104 l34 3" class="med" fill="none" stroke="#FF9B29"/>
    <path d="M131 58 l-20 -19" class="med" fill="none" stroke="#36C5BE"/>
    <path d="M88 95 l-28 -6" class="med" fill="none" stroke="#36C5BE"/>
  </g>

</svg>
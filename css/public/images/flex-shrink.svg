  </style>
  <text x="215" y="23" text-anchor="middle" class="head" style="font-family:DejaVu Sans Mono, Consolas, monospace;">flex-shrink: 1</text>
  <text x="215" y="47" text-anchor="middle" class="small">Container: <tspan font-family="DejaVu Sans Mono, Consolas, monospace">140px</tspan> · no gap</text>

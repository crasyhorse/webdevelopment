  <text x="211.5" y="124" text-anchor="middle" class="" style="font-family:DejaVu Sans Mono, Consolas, monospace;">100px</text>
  <path d="M199.0 85 V151" stroke="#9A6A2C" stroke-width="2" stroke-dasharray="4 3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 285" role="img" aria-labelledby="title">
  <title id="title">Typeface and interface personality</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      fill: #263C55;
    }
    .heading {
      font-size: 24px;
      font-weight: 700;
    }
    .detail {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
      font-size: 17px;
    }
  </style>
  <text x="220" y="26" class="heading" text-anchor="middle">Soft &amp; approachable</text>
  <rect x="12" y="42" width="416" height="205" rx="16" fill="#ECF0DC" stroke="#CAD5E0" stroke-width="1.5" />
  <text x="30" y="80" style="font-family: Nunito, Lato, sans-serif; font-size: 30px; font-weight: 700; fill: #263C55;">My daily tasks</text>
  <text x="30" y="106" style="font-family: Nunito, Lato, sans-serif; font-size: 18px; font-weight: 400; fill: #263C55;">Make today a little better.</text>
  <rect x="30" y="123" width="380" height="48" rx="16" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="1.5" />
  <circle cx="51" cy="147" r="9" fill="#C8D59A" stroke="#6C7D2C" stroke-width="1.5" />
  <text x="75" y="154" style="font-family: Nunito, Lato, sans-serif; font-size: 20px; font-weight: 400; fill: #263C55;">Plan the week</text>
  <rect x="30" y="188" width="155" height="40" rx="16" fill="#C8D59A" stroke="none" stroke-width="1.5" />
  <text x="49" y="214" style="font-family: Nunito, Lato, sans-serif; font-size: 19px; font-weight: 700; fill: #263C55;">+ Add task</text>
  <text x="220" y="272" class="detail" text-anchor="middle">Nunito / Lato fallback</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img">
  <title>Flex alignment</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 19px;
    }
    .head {
      font-weight: 700;
      font-size: 21px;
    }
    .small {
      font-size: 16px;
    }
    .frame {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
    .item {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 2;
    }
    .accent {
      fill: #C8D59A;
      stroke: #6C7D2C;
      stroke-width: 2;
    }
    .orange {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
    }
  </style>
  <text x="220" y="30" text-anchor="middle" class="small" style="font-family:DejaVu Sans Mono, Consolas, monospace;">align-items: stretch</text>
  <rect x="20" y="40" width="400" height="78" rx="5" class="frame"/>
  <rect x="42" y="46" width="97" height="66" rx="5" class="item"/>
  <text x="90.5" y="85.0" text-anchor="middle" class="">A</text>
  <rect x="157" y="46" width="97" height="66" rx="5" class="orange"/>
  <text x="205.5" y="85.0" text-anchor="middle" class="">B</text>
  <rect x="272" y="46" width="97" height="66" rx="5" class="accent"/>
  <text x="320.5" y="85.0" text-anchor="middle" class="">C</text>
  <text x="220" y="145" text-anchor="middle" class="small" style="font-family:DejaVu Sans Mono, Consolas, monospace;">align-items: center</text>
  <rect x="20" y="155" width="400" height="78" rx="5" class="frame"/>
  <rect x="42" y="177" width="97" height="34" rx="5" class="item"/>
  <text x="90.5" y="200.0" text-anchor="middle" class="">A</text>
  <rect x="157" y="170" width="97" height="48" rx="5" class="orange"/>
  <text x="205.5" y="200.0" text-anchor="middle" class="">B</text>
  <rect x="272" y="175" width="97" height="38" rx="5" class="accent"/>
  <text x="320.5" y="200.0" text-anchor="middle" class="">C</text>
  <text x="220" y="260" text-anchor="middle" class="small" style="font-family:DejaVu Sans Mono, Consolas, monospace;">center + align-self: flex-end on B</text>
  <rect x="20" y="270" width="400" height="78" rx="5" class="frame"/>
  <rect x="42" y="292" width="97" height="34" rx="5" class="item"/>
  <text x="90.5" y="315.0" text-anchor="middle" class="">A</text>
  <rect x="157" y="294" width="97" height="48" rx="5" class="orange"/>
  <text x="205.5" y="314" text-anchor="middle">B</text>
  <text x="205.5" y="335" text-anchor="middle" style="font-family:DejaVu Sans Mono, Consolas, monospace;font-size:8px">.actions__item--end</text>
  <rect x="272" y="290" width="97" height="38" rx="5" class="accent"/>
  <text x="320.5" y="315.0" text-anchor="middle" class="">C</text>
</svg>

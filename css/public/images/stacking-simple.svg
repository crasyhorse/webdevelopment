<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-labelledby="title desc">
  <title id="title">Simple z-index stacking</title>
  <desc id="desc">Three overlapping boxes with z-index 1, 2 and 3 in the same stacking context.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .label {
      font-size: 16px;
      font-weight: 700;
    }
    .code {
      font-size: 15px;
      font-family: DejaVu Sans Mono, Consolas, monospace;
    }
  </style>
  <rect width="420" height="260" rx="16" fill="#FAFBFC"/>
  <rect x="22" y="137" width="174" height="105" rx="10" fill="#C2D8E4" stroke="#4C7186" stroke-width="3"/>
  <text x="109" y="197" text-anchor="middle" class="label">Box A</text>
  <text x="109" y="219" text-anchor="middle" class="code" style="font-family:DejaVu Sans Mono, Consolas, monospace;">z-index: 1</text>
  <rect x="114" y="78" width="174" height="105" rx="10" fill="#EBC08F" stroke="#9A6A2C" stroke-width="3"/>
  <text x="201" y="139" text-anchor="middle" class="label" style="fill:#263C55">Box B</text>
  <text x="201" y="161" text-anchor="middle" class="code" style="font-family:DejaVu Sans Mono, Consolas, monospace;fill:#263C55">z-index: 2</text>
  <rect x="220" y="18" width="174" height="105" rx="10" fill="#D8E2B8" stroke="#6C7D2C" stroke-width="3"/>
  <text x="307" y="62" text-anchor="middle" class="label" style="fill:#263C55">Box C</text>
  <text x="307" y="85" text-anchor="middle" class="code" style="font-family:DejaVu Sans Mono, Consolas, monospace;fill:#263C55">z-index: 3</text>
</svg>

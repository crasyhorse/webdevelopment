<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">CSS box model</title>
  <desc id="desc">A box model diagram with four nested colored rectangles: margin in peach, border in pale yellow, padding in light green, and content in light blue.</desc>

  <defs>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; }
      .frame { fill: #F3F5F7; }
      .panel { fill: #FAFBFC; stroke: #CAD5E0; stroke-width: 3; }
      .marginBox { fill: #EBC08F; stroke: #9A6A2C; stroke-width: 4; stroke-dasharray: 10 7; }
      .borderBox { fill: #E7D89B; stroke: #8C7428; stroke-width: 4; }
      .paddingBox { fill: #C8D59A; stroke: #6C7D2C; stroke-width: 4; }
      .contentBox { fill: #A8C8D9; stroke: #4C7186; stroke-width: 4; }
      .title { font-size: 34px; font-weight: 700; fill: #163A64; }
      .layer { font-size: 34px; font-weight: 700; }
      .caption { font-size: 24px; fill: #475B6A; }
      .small { font-size: 21px; fill: #475B6A; }
      .mText { fill: #7E5317; }
      .bText { fill: #756118; }
      .pText { fill: #53631E; }
      .cText { fill: #2F536B; }
    </style>
  </defs>

  <rect width="1400" height="680" class="frame"/>
  <rect x="80" y="40" width="1240" height="600" rx="24" class="panel"/>

  <text x="700" y="95" text-anchor="middle" class="ui title">CSS Box Model</text>

  <!-- margin -->
  <rect x="210" y="145" width="980" height="400" rx="12" class="marginBox"/>
  <text x="700" y="185" text-anchor="middle" class="ui layer mText">Margin</text>
  <text x="700" y="580" text-anchor="middle" class="ui small">outside spacing</text>

  <!-- border -->
  <rect x="330" y="220" width="740" height="250" rx="10" class="borderBox"/>
  <text x="700" y="258" text-anchor="middle" class="ui layer bText">Border</text>

  <!-- padding -->
  <rect x="445" y="290" width="510" height="120" rx="8" class="paddingBox"/>
  <text x="700" y="326" text-anchor="middle" class="ui layer pText">Padding</text>

  <!-- content -->
  <rect x="570" y="335" width="260" height="52" rx="6" class="contentBox"/>
  <text x="700" y="369" text-anchor="middle" class="ui layer cText" style="font-size:28px;">Content</text>
</svg>

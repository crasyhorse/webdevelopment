<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">CSS box model</title><desc id="desc">Nested rectangles identify margin, border, padding, and content with consistent high contrast and dimensions.</desc>
<rect width="1400" height="680" fill="#F3F5F7"/>
<rect x="80" y="40" width="1240" height="600" rx="24" fill="#F9FBFD" stroke="#CAD5E0" stroke-width="3"/>
<text x="116" y="89" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#244967">Margin — outside spacing</text>
<rect x="215" y="130" width="970" height="440" rx="20" fill="#F5D8DD" stroke="#B64253" stroke-width="4"/>
<text x="249" y="178" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#872A39">Border — visible edge</text>
<rect x="350" y="218" width="700" height="295" rx="18" fill="#FFF1D5" stroke="#B47625" stroke-width="4"/>
<text x="385" y="265" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#855314">Padding — inner spacing</text>
<rect x="485" y="308" width="430" height="145" rx="15" fill="#D6E8FB" stroke="#2E74B5" stroke-width="4"/>
<text x="700" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1B4E7C">Content</text>
<text x="700" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#2F577C">Text or image</text>
<text x="700" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#506478">Each layer surrounds the layer inside it.</text>
</svg>
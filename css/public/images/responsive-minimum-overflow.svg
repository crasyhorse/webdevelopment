<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" role="img">
  <title>Responsive minimum overflow</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-weight: 400;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
  </style>
  <text x="130" y="23" text-anchor="middle" font-size="17" class="code">240px container</text>
  <rect x="10" y="35" width="240" height="80" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="10" y="45" width="192" height="60" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="106" y="82" text-anchor="middle" font-size="16" class="code">192px minimum</text>
  <text x="370" y="23" text-anchor="middle" font-size="17" class="code">160px container</text>
  <rect x="290" y="35" width="160" height="80" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="290" y="45" width="192" height="60" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="386" y="82" text-anchor="middle" font-size="16" class="code">192px minimum</text>
  <text x="386" y="140" text-anchor="middle" font-size="18" font-weight="700">Overflow</text>
</svg>

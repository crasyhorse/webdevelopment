<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
<title id="title">Automatic height of a task card</title><desc id="desc">An automatically sized task card grows tall enough for five lines of text.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1c344e; }
.label { font-size: 25px; font-weight: 700; }
.note { font-size: 19px; }
.small { font-size: 17px; }
.content { fill: #a8c8d9; stroke: #4c7186; stroke-width: 3; }
.frame { fill: #fff; stroke: #345b83; stroke-width: 4; }
.dim { stroke: #214c75; stroke-width: 3; }
</style>
<rect width="760" height="330" rx="14" fill="#f3f6f9"/>
<rect x="60" y="58" width="640" height="210" rx="10" class="frame"/>
<text x="70" y="81" class="label">Task card</text>
<text x="75" y="112" class="note">Review the pull request</text>
<text x="75" y="147" class="note">Check failing tests and any new</text>
<text x="75" y="182" class="note">comments before approving.</text>
<text x="75" y="217" class="note">Check the build status again.</text>
<text x="75" y="252" class="note">Ask a teammate for feedback.</text>
<text x="380" y="310" text-anchor="middle" class="label">height: auto — all text fits</text>
</svg>
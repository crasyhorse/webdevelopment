<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
<title id="title">Fixed height and overflowing text</title><desc id="desc">The task card has a short fixed height; lower lines of text visibly continue outside its bottom border.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1c344e; }
.label { font-size: 25px; font-weight: 700; }
.note { font-size: 19px; }
.small { font-size: 17px; }
.content { fill: #a8c8d9; stroke: #4c7186; stroke-width: 3; }
.frame { fill: #fff; stroke: #345b83; stroke-width: 4; }
.dim { stroke: #214c75; stroke-width: 3; }
</style>
<rect width="760" height="470" rx="14" fill="#f3f6f9"/>
<rect x="60" y="58" width="640" height="133" rx="10" class="frame"/>
<text x="100" y="101" class="label">Task card</text><text x="105" y="132" class="note">Review the pull request</text>
<text x="105" y="167" class="note">Check failing tests and any new</text>
<text x="105" y="202" class="note">comments before approving.</text>
<text x="105" y="237" class="note">Check the build status again.</text>
<text x="105" y="272" class="note">Ask a teammate for feedback.</text>
<line x1="60" y1="191" x2="700" y2="191" stroke="#b23d47" stroke-width="4" stroke-dasharray="8 5"/>
<text x="380" y="414" text-anchor="middle" class="label" fill="#9d242e">height: 120px — text overflows</text>
</svg>
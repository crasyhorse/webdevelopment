<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 355" role="img">
  <title>Color roles in Task Manager and illustrative 60-30-10 heuristic</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading {
      font-size: 24px;
      font-weight: 700;
    }
    .detail {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
      font-size: 17px;
    }
  </style>
  <rect x="10" y="10" width="860" height="285" rx="8" fill="#F3F6F9" stroke="#CAD5E0" stroke-width="2" />
  <rect x="10" y="10" width="860" height="52" rx="6" fill="#263C55" />
  <text x="28" y="44" style="font-size: 26px; fill: #FFFFFF; font-weight: 700;">Task Manager</text>
  <rect x="700" y="20" width="150" height="32" rx="5" fill="#125BD4" />
  <text x="775" y="42" text-anchor="middle" style="font-size: 17px; fill: #FFFFFF;">Add task</text>
  <rect x="22" y="74" width="175" height="208" rx="5" fill="#E1ECF2" />
  <text x="35" y="103" style="font-size: 20px; font-weight: 700;">All tasks</text>
  <text x="35" y="135" style="font-size: 18px;">Pending</text>
  <text x="35" y="167" style="font-size: 18px;">Completed</text>
  <text x="215" y="101" class="heading">Your tasks</text>
  <rect x="215" y="113" width="640" height="50" rx="5" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="230" y="143" style="font-size: 18px; font-weight: 700;">Review pull request</text>
  <rect x="685" y="123" width="155" height="30" rx="4" fill="#E7B44C" />
  <text x="762" y="143" text-anchor="middle" style="font-size: 15px;">High priority</text>
  <rect x="215" y="169" width="640" height="50" rx="5" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="230" y="199" style="font-size: 18px; font-weight: 700;">Update documentation</text>
  <rect x="685" y="179" width="155" height="30" rx="4" fill="#A8C8D9" />
  <text x="762" y="199" text-anchor="middle" style="font-size: 15px;">Pending</text>
  <rect x="215" y="225" width="640" height="50" rx="5" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="230" y="255" style="font-size: 18px; font-weight: 700;">Test responsive layout</text>
  <rect x="685" y="235" width="155" height="30" rx="4" fill="#C8D59A" />
  <text x="762" y="255" text-anchor="middle" style="font-size: 15px;">Completed</text>
  <rect x="10" y="310" width="516" height="36" rx="0" fill="#E1ECF2" />
  <text x="268.0" y="334" text-anchor="middle" style="font-size: 16px; fill: #263C55;">60% dominant</text>
  <rect x="526" y="310" width="258" height="36" rx="0" fill="#4C7186" />
  <text x="655.0" y="334" text-anchor="middle" style="font-size: 16px; fill: #FFFFFF;">30% supporting</text>
  <rect x="784" y="310" width="86" height="36" rx="0" fill="#EBC08F" />
  <text x="827.0" y="334" text-anchor="middle" style="font-size: 16px; fill: #263C55;">10%</text>
</svg>

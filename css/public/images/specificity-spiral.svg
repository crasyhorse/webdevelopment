<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img">
  <title>The Specificity Spiral</title>
  <desc>Five steps climbing from a single class selector over a class chain to an ID selector and finally !important, each step added only to beat the previous rule.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .annotation { font-size: 16px; fill: #526B80; }
    .code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 15px; }
  </style>
  <rect x="8" y="8" width="764" height="284" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="2" />
  <rect x="32" y="216" width="220" height="48" rx="6" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="44" y="246" class="code">.task-list__item</text>
  <rect x="150" y="168" width="260" height="48" rx="6" fill="#E7D89B" stroke="#8C7428" stroke-width="2" />
  <text x="162" y="198" class="code">.task-manager .task-list__item</text>
  <rect x="270" y="120" width="290" height="48" rx="6" fill="#EBC08F" stroke="#9A6A2C" stroke-width="2" />
  <text x="282" y="150" class="code">#tasks .task-list__item</text>
  <rect x="390" y="72" width="330" height="48" rx="6" fill="#F1D3B1" stroke="#9A6A2C" stroke-width="2" />
  <text x="402" y="102" class="code">#tasks .list li.task-list__item</text>
  <rect x="470" y="24" width="290" height="48" rx="6" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="482" y="54" class="code">… { color: red !important }</text>
  <path d="M 252 240 C 300 240 300 192 348 192" fill="none" stroke="#8095AA" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 410 192 C 460 192 460 144 508 144" fill="none" stroke="#8095AA" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 560 144 C 610 144 610 96 658 96" fill="none" stroke="#8095AA" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 640 96 C 680 96 680 48 712 48" fill="none" stroke="#8095AA" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8095AA" />
    </marker>
  </defs>
  <text x="32" y="196" class="annotation">each step exists only to beat the one below</text>
</svg>

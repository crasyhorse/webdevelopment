<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 250" role="img" aria-labelledby="title desc">
  <title id="title">The em square and CSS font size</title>
  <desc id="desc">A schematic capital H occupies 700 of 1000 font units vertically. At a CSS font size of 20 pixels, the em square represents 20 pixels and the cap height represents 14 pixels.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 19px;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
    .heading {
      font-size: 21px;
      font-weight: 700;
    }
    .guide {
      fill: none;
      stroke: #8095AA;
      stroke-width: 1.5;
    }
    .measurement {
      fill: none;
      stroke: #4C7186;
      stroke-width: 2;
    }
  </style>
  <!-- The square is 190 by 190 drawing units. The cap height is 70% of that. -->
  <text x="142" y="23" text-anchor="middle" class="heading">Em square</text>
  <rect x="47" y="34" width="190" height="190" fill="#E1ECF2" stroke="#4C7186" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M87 53 H105 V108 H151 V53 H169 V186 H151 V126 H105 V186 H87 Z" fill="#263C55" />
  <path d="M47 186 H237" class="guide" stroke-dasharray="5 4" />
  <path d="M47 53 H237" class="guide" stroke-dasharray="5 4" />
  <path d="M38 34 H30 V224 H38" class="measurement" />
  <text x="20" y="129" text-anchor="middle" transform="rotate(-90 20 129)" font-size="17">1000 units</text>
  <path d="M246 53 H254 V186 H246" class="measurement" />
  <text x="264" y="113">700 units</text>
  <text x="264" y="135" font-size="16">cap height</text>
  <text x="142" y="244" text-anchor="middle" font-size="16">Font design scale</text>
  <path d="M368 129 H411 M401 121 L411 129 L401 137" class="measurement" />
  <text x="438" y="58" class="heading">CSS rendering</text>
  <rect x="430" y="70" width="323" height="52" rx="5" fill="#F3F6F9" stroke="#CAD5E0" />
  <text x="447" y="102" class="code">font-size: 20px;</text>
  <text x="438" y="150">Em square: 20px</text>
  <text x="438" y="180">Cap height: 14px</text>
  <text x="438" y="211" class="code" font-size="16">700 / 1000 × 20px = 14px</text>
  <text x="438" y="239" font-size="16" fill="#526B80">Illustrative font metrics</text>
</svg>

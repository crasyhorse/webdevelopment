<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" role="img">
  <title>Responsive flex wrap</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-weight: 400;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
  </style>
  <text x="250" y="22" text-anchor="middle" font-size="16" class="code">448px</text>
  <rect x="20" y="30" width="448" height="60" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="20" y="30" width="128" height="40" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="84" y="56" text-anchor="middle" font-size="19">A</text>
  <rect x="164" y="30" width="128" height="40" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="228" y="56" text-anchor="middle" font-size="19">B</text>
  <rect x="308" y="30" width="128" height="40" rx="4" fill="#E7D89B" stroke="#8C7428" stroke-width="2" />
  <text x="372" y="56" text-anchor="middle" font-size="19">C</text>
  <text x="250" y="172" text-anchor="middle" font-size="16" class="code">300px</text>
  <rect x="20" y="180" width="300" height="112" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="20" y="180" width="128" height="40" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="84" y="206" text-anchor="middle" font-size="19">A</text>
  <rect x="164" y="180" width="128" height="40" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="228" y="206" text-anchor="middle" font-size="19">B</text>
  <rect x="20" y="236" width="128" height="40" rx="4" fill="#E7D89B" stroke="#8C7428" stroke-width="2" />
  <text x="84" y="262" text-anchor="middle" font-size="19">C</text>

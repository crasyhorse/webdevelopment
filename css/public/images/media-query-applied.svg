<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 231" role="img" aria-labelledby="title desc">
  <title id="title">Query matches</title>
  <desc id="desc">Two alternative approaches; mobile-first starts stacked and desktop-first starts side by side. Schematic layouts.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      fill: #263C55;
      font-weight: 400;
    }
    .heading {
      font-size: 22px;
      font-weight: 700;
    }
    .annotation {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
    .frame {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
  </style>
  <text x="220" y="23" text-anchor="middle" class="heading">Query matches</text>
  <text x="10" y="58" text-anchor="start" class="annotation" style="font-size: 16px;">Mobile-first</text>
  <text x="10" y="80" text-anchor="start" class="code" style="font-size: 16px;">900px</text>
  <rect x="107" y="41" width="320" height="85" rx="4" class="frame" />
  <rect x="115" y="49" width="74.0" height="69" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="152.0" y="89.5" text-anchor="middle">Nav</text>
  <rect x="197.0" y="49" width="222.0" height="69" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="308.0" y="89.5" text-anchor="middle">Tasks</text>
  <text x="10" y="158" text-anchor="start" class="annotation" style="font-size: 16px;">Desktop-first</text>
  <text x="10" y="180" text-anchor="start" class="code" style="font-size: 16px;">600px</text>
  <rect x="107" y="141" width="215" height="85" rx="4" class="frame" />
  <rect x="115" y="149" width="199" height="30.5" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="214.5" y="170.25" text-anchor="middle">Nav</text>
  <rect x="115" y="187.5" width="199" height="30.5" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="214.5" y="208.75" text-anchor="middle">Tasks</text>
</svg>

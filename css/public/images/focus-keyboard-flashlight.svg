<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 216" role="img">
  <title>Keyboard Users See Only the Focused Control</title>
  <desc>The same Task Manager page darkened except for a flashlight circle around the focused Add task button, which shows a bright focus ring.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .annotation { font-size: 16px; fill: #526B80; }
    .detail { font-size: 14px; fill: #526B80; }
  </style>
  <defs>
    <radialGradient id="beam" cx="303" cy="83" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263C55" stop-opacity="0" />
      <stop offset="35%" stop-color="#263C55" stop-opacity="0" />
      <stop offset="75%" stop-color="#263C55" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#263C55" stop-opacity="0.92" />
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="374" height="200" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="2" />
  <rect x="24" y="24" width="342" height="30" rx="6" fill="#E8EDF2" />
  <text x="38" y="45" class="heading">Task Manager</text>
  <rect x="24" y="68" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="38" y="89" class="detail">Search tasks…</text>
  <rect x="240" y="68" width="126" height="30" rx="6" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="303" y="89" text-anchor="middle">Add task</text>
  <rect x="24" y="112" width="342" height="26" rx="6" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="38" y="130" class="detail">Review pull request</text>
  <rect x="24" y="146" width="342" height="26" rx="6" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="38" y="164" class="detail">Update documentation</text>
  <rect x="24" y="180" width="342" height="26" rx="6" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <text x="38" y="198" class="detail">Inspect keyboard focus</text>
  <rect x="8" y="8" width="374" height="200" rx="8" fill="url(#beam)" />
  <rect x="234" y="62" width="138" height="42" rx="9" fill="none" stroke="#FAFBFC" stroke-width="3" />
  <rect x="240" y="68" width="126" height="30" rx="6" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="303" y="89" text-anchor="middle">Add task</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img">
  <title>Named dashboard areas.</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 22px;
    }
    .head {
      font-weight: 700;
      font-size: 25px;
    }
    .small {
      font-size: 18px;
    }
    .frame {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 7 5;
    }
    .item {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 2;
    }
    .accent {
      fill: #C8D59A;
      stroke: #6C7D2C;
      stroke-width: 2;
    }
    .orange {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
    }
  </style>
  <rect x="30" y="25" width="740" height="380" rx="7" class="frame"/>
  <rect x="50" y="45" width="700" height="65" rx="7" class="accent"/>
  <text x="400.0" y="84.5" text-anchor="middle" class="">Header</text>
  <rect x="50" y="125" width="160" height="260" rx="7" class="orange"/>
  <text x="130.0" y="262.0" text-anchor="middle" class="">Sidebar</text>
  <rect x="225" y="125" width="345" height="260" rx="7" class="item"/>
  <text x="397.5" y="262.0" text-anchor="middle" class="">Tasks</text>
  <rect x="585" y="125" width="165" height="260" rx="7" class="accent"/>
  <text x="667.5" y="262.0" text-anchor="middle" class="">Stats</text>
</svg>

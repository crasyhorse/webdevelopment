<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">Content-box and border-box</title><desc id="desc">Content-box declares a width of 300 pixels for the blue content area and adds padding and border to 348 pixels. Border-box declares 300 pixels for the entire border box.</desc>
<rect width="1080" height="620" fill="#F3F5F7"/><rect x="36" y="35" width="475" height="530" rx="20" fill="white" stroke="#C5D2DF" stroke-width="3"/><rect x="570" y="35" width="475" height="530" rx="20" fill="white" stroke="#C5D2DF" stroke-width="3"/>
<g font-family="Arial, sans-serif" fill="#173F66"><text x="272" y="93" font-size="37" font-weight="700" text-anchor="middle">content-box</text><text x="808" y="93" font-size="37" font-weight="700" text-anchor="middle">border-box</text></g>
<rect x="91" y="150" width="365" height="290" fill="#F8D7DE" stroke="#B64253" stroke-width="5"/><rect x="119" y="177" width="310" height="237" fill="#FFEAC5" stroke="#BF8539" stroke-width="3"/><rect x="147" y="205" width="254" height="181" fill="#D9EAFF" stroke="#2E74B5" stroke-width="3"/><text x="274" y="303" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E568A">Content width</text><text x="274" y="337" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E568A">300px</text>
<rect x="638" y="150" width="315" height="290" fill="#F8D7DE" stroke="#B64253" stroke-width="5"/><rect x="666" y="177" width="259" height="237" fill="#FFEAC5" stroke="#BF8539" stroke-width="3"/><rect x="694" y="205" width="203" height="181" fill="#D9EAFF" stroke="#2E74B5" stroke-width="3"/><text x="795" y="303" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E568A">Content</text><text x="795" y="337" text-anchor="middle" font-family="Arial" font-size="27" fill="#1E568A">244px</text>
<g font-family="Arial" font-size="28" fill="#173F66" text-anchor="middle"><text x="272" y="493">Total border width: <tspan font-weight="700">348px</tspan></text><text x="808" y="493">Total border width: <tspan font-weight="700">300px</tspan></text></g>
<text x="541" y="598" font-family="Arial" font-size="21" text-anchor="middle" fill="#526879">Same padding (20px per side) and border (4px per side) in both examples.</text></svg>
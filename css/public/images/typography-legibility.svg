<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title">
  <title id="title">Legibility: compare similar glyphs in two font families</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      fill: #263C55;
    }
    .heading {
      font-size: 24px;
      font-weight: 700;
    }
    .detail {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
      font-size: 17px;
    }
  </style>
  <rect x="8" y="8" width="424" height="284" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="1.5" />
  <text x="24" y="40" class="heading">Recognize individual glyphs</text>
  <text x="24" y="90" class="detail">Arial</text>
  <text x="24" y="133" style="font-family: Arial, Helvetica, sans-serif; font-size: 36px;">I l 1   O 0   rn m</text>
  <text x="24" y="180" class="detail">DejaVu Sans Mono</text>
  <text x="24" y="223" style="font-family: DejaVu Sans Mono, Consolas, monospace; font-size: 36px;">I l 1   O 0   rn m</text>
  <text x="24" y="270" class="detail">Compare similar-looking characters.</text>

</svg>

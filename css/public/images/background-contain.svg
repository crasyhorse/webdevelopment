<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" role="img">
  <title>Background Contain</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .detail { font-size: 16px; fill: #526B80; }
    .code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 17px; }
  </style>
  <rect x="20" y="20" width="300" height="200" rx="0" fill="#E8EDF2" stroke="#8095AA" stroke-width="2" />
  <defs>

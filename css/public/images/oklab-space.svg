<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 248" role="img">
  <title>The Oklab Color Space</title>
  <desc>Oklab axes: vertical lightness from black to white, a horizontal green to red axis, and a blue to yellow axis. Equal numeric steps produce equal perceived differences.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .annotation { font-size: 16px; fill: #526B80; }
    .detail { font-size: 14px; fill: #526B80; }
  </style>
  <defs>
    <linearGradient id="lgrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="374" height="232" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="2" />
  <line x1="70" y1="128" x2="320" y2="128" stroke="#8095AA" stroke-width="2" />
  <line x1="95" y1="200" x2="295" y2="56" stroke="#8095AA" stroke-width="2" />
  <rect x="178" y="36" width="34" height="184" fill="url(#lgrad)" stroke="#CAD5E0" stroke-width="2" />
  <circle cx="70" cy="128" r="12" fill="#2E9E4F" />
  <circle cx="320" cy="128" r="12" fill="#C0392B" />
  <circle cx="95" cy="200" r="12" fill="#125BD4" />
  <circle cx="295" cy="56" r="12" fill="#E6C229" />
  <text x="24" y="106" class="annotation">−a green</text>
  <text x="300" y="106" class="annotation">+a red</text>
  <text x="24" y="228" class="annotation">−b blue</text>
  <text x="286" y="40" class="annotation">+b yellow</text>
  <text x="222" y="220" class="annotation">L: black → white</text>
</svg>

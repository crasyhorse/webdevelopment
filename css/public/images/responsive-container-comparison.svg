<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" role="img">
  <title>Responsive container comparison</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-weight: 400;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
    }
  </style>
  <rect x="5" y="5" width="730" height="260" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" />
  <text x="370" y="28" text-anchor="middle" font-size="20" font-weight="700">Same viewport</text>
  <rect x="20" y="45" width="220" height="205" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <text x="130.0" y="70" text-anchor="middle" font-size="18" font-weight="700">Narrow container</text>
  <rect x="32" y="85" width="196" height="50" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="130.0" y="117" text-anchor="middle" font-size="18">Task summary</text>
  <rect x="32" y="145" width="196" height="85" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="130.0" y="190" text-anchor="middle" font-size="18">8 tasks</text>
  <rect x="260" y="45" width="460" height="205" rx="4" fill="#F3F6F9" stroke="#8095AA" stroke-width="2" stroke-dasharray="6 4" />
  <text x="490.0" y="70" text-anchor="middle" font-size="18" font-weight="700">Wide container</text>
  <rect x="272" y="85" width="220" height="145" rx="4" fill="#A8C8D9" stroke="#4C7186" stroke-width="2" />
  <text x="382" y="163" text-anchor="middle" font-size="18">Task summary</text>
  <rect x="504" y="85" width="204" height="145" rx="4" fill="#C8D59A" stroke="#6C7D2C" stroke-width="2" />
  <text x="606" y="163" text-anchor="middle" font-size="18">8 tasks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title">
  <title id="title">Readability: same passage with different letter spacing</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      fill: #263C55;
    }
    .heading {
      font-size: 24px;
      font-weight: 700;
    }
    .detail {
      font-size: 16px;
      fill: #526B80;
    }
    .code {
      font-family: "DejaVu Sans Mono", Consolas, monospace;
      font-size: 17px;
    }
  </style>
  <rect x="8" y="8" width="424" height="284" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="1.5" />
  <text x="24" y="40" class="heading">Read connected text</text>
  <text x="24" y="75" class="detail">Tight spacing</text>
  <text x="24" y="102" font-size="20" letter-spacing="-0.9" font-weight="400">Readable interfaces help users</text>
  <text x="24" y="127" font-size="20" letter-spacing="-0.9" font-weight="400">find information and complete</text>
  <text x="24" y="152" font-size="20" letter-spacing="-0.9" font-weight="400">their tasks with confidence.</text>
  <text x="24" y="184" class="detail">More open spacing</text>
  <text x="24" y="211" font-size="20" letter-spacing="0.2" font-weight="400">Readable interfaces help users</text>
  <text x="24" y="236" font-size="20" letter-spacing="0.2" font-weight="400">find information and complete</text>
  <text x="24" y="261" font-size="20" letter-spacing="0.2" font-weight="400">their tasks with confidence.</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img">
  <title>Grid with two columns and two rows.</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 22px;
    }
    .head {
      font-weight: 700;
      font-size: 25px;
    }
    .small {
      font-size: 18px;
    }
    .frame {
      fill: #F3F6F9;
      stroke: #8095AA;
      stroke-width: 2;
      stroke-dasharray: 7 5;
    }
    .item {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 2;
    }
    .accent {
      fill: #C8D59A;
      stroke: #6C7D2C;
      stroke-width: 2;
    }
    .orange {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
    }
  </style>
  <rect x="35" y="65" width="730" height="310" rx="7" class="frame"/>
  <text x="278.3333" y="40" text-anchor="middle" class="head"><tspan font-family="DejaVu Sans Mono, Consolas, monospace">2fr</tspan>: 2 shares</text>
  <text x="633.3333" y="40" text-anchor="middle" class="head"><tspan font-family="DejaVu Sans Mono, Consolas, monospace">1fr</tspan>: 1 share</text>
  <rect x="55" y="85" width="446.6667" height="125" rx="7" class="item"/>
  <text x="278.3333" y="154.5" text-anchor="middle" class="">Task list</text>
  <rect x="521.6667" y="85" width="223.3333" height="125" rx="7" class="accent"/>
  <text x="633.3333" y="154.5" text-anchor="middle" class="">Statistics</text>
  <rect x="55" y="230" width="446.6667" height="125" rx="7" class="item"/>
  <text x="278.3333" y="299.5" text-anchor="middle" class="">Attachment</text>
  <rect x="521.6667" y="230" width="223.3333" height="125" rx="7" class="accent"/>
  <text x="633.3333" y="299.5" text-anchor="middle" class="">Form</text>
  <text x="400" y="405" text-anchor="middle" class="small">gap separates tracks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="title desc">
  <title id="title">Badge anchored to page</title>
  <desc id="desc">The badge is positioned at the top right of the initial containing block.</desc>
  <rect x="8" y="8" width="464" height="234" rx="12" fill="#F3F6F9" stroke="#8095AA" stroke-width="2"/>
  <text x="24" y="43" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526B80">Browser viewport</text>
  <rect x="40" y="84" width="394" height="136" rx="10" fill="#E1ECF2" stroke="#4C7186" stroke-width="2"/>
  <text x="58" y="123" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#263C55">Task card</text>
  <text x="58" y="163" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#263C55">Review the pull request</text>
  <text x="58" y="193" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526B80">Status: open</text>
  <rect x="8" y="8" width="464" height="234" rx="10" fill="none" stroke="#4C7186" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="324" y="24" width="132" height="34" rx="6" fill="#EBC08F" stroke="#9A6A2C" stroke-width="1.5"/>
  <text x="390" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#263C55">High priority</text>
  <path d="M390 24 V8 M456 41 H472" stroke="#9A6A2C" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" role="img">
  <title>Background Cover</title>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .detail { font-size: 16px; fill: #526B80; }
    .code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 17px; }
  </style>
  <rect x="20" y="20" width="300" height="200" rx="0" fill="#E8EDF2" stroke="#8095AA" stroke-width="2" />
  <defs>
    <clipPath id="frame">
      <rect x="20" y="20" width="300" height="200" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="-30" y="20" width="400" height="200" fill="#C2D8E4" />
    <circle cx="270.0" cy="70.0" r="26.0" fill="#E7D89B" />
    <path d="M-30 220 L90.0 70.0 L230.0 220 Z" fill="#9FAD68" />
    <path d="M110.0 220 L258.0 100.0 L370 220 Z" fill="#7FA1B4" />
  </g>
  <text x="170" y="250" class="code" text-anchor="middle">background-size: cover</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #213b54; }
  .lbl { font-size: 28px; font-weight: 700; }
  .note { font-size: 23px; }
  .small { font-size: 19px; }
  .card { fill: #fafcfe; stroke: #60798d; stroke-width: 5; }
  .content { fill: #a8cddd; stroke: #4c86a5; stroke-width: 3; }
  .padding { fill: #c6d994; }
  .border { fill: #E7D89B; stroke: #8C7428; stroke-width: 3; }
  .margin { fill: #f7d3a3; stroke: #c17b2e; stroke-width: 2; stroke-dasharray: 9 7; }
</style>
<rect width="900" height="560" fill="#f3f6f9"/>
<rect x="20" y="20" width="860" height="520" rx="18" fill="#fff" stroke="#cdd8e2" stroke-width="2"/>
<title id="title">Margin between two task cards</title>
<desc id="desc">Two task cards stack vertically. Their orange highlighted separation is the first card's bottom margin.</desc>
<text x="450" y="75" text-anchor="middle" class="lbl">Margin — outer space</text>
<rect x="150" y="110" width="600" height="130" rx="10" class="border"/>
<rect x="159" y="119" width="582" height="112" rx="5" class="padding"/>
<rect x="188" y="143" width="524" height="64" rx="5" class="content"/>
<text x="450" y="184" text-anchor="middle" class="lbl">Task card 1</text>
<rect x="150" y="244" width="600" height="100" class="margin"/>
<text x="450" y="302" text-anchor="middle" class="lbl" style="fill:#8d5616">margin-bottom: 1.5rem</text>
<rect x="150" y="348" width="600" height="130" rx="10" class="border"/>
<rect x="159" y="357" width="582" height="112" rx="5" class="padding"/>
<rect x="188" y="381" width="524" height="64" rx="5" class="content"/>
<text x="450" y="422" text-anchor="middle" class="lbl">Task card 2</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .lbl {
      font-size: 28px;
      font-weight: 700;
    }
    .note {
      font-size: 23px;
    }
    .small {
      font-size: 19px;
    }
    .card {
      fill: #FAFBFC;
      stroke: #526B80;
      stroke-width: 5;
    }
    .content {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 3;
    }
    .padding {
      fill: #C8D59A;
    }
    .border {
      fill: #E7D89B;
      stroke: #8C7428;
      stroke-width: 3;
    }
    .margin {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
      stroke-dasharray: 9 7;
    }
  </style>
  <rect width="900" height="560" fill="#F3F6F9"/>
  <rect x="20" y="20" width="860" height="520" rx="18" fill="#fff" stroke="#CAD5E0" stroke-width="2"/>
  <title id="title">Margin between two task cards</title>
  <desc id="desc">Two task cards stack vertically. Both task cards have an orange bottom margin, including the second card.</desc>
  <text x="450" y="75" text-anchor="middle" class="lbl">Margin — outer space</text>
  <rect x="150" y="102" width="600" height="116" rx="10" class="border"/>
  <rect x="159" y="111" width="582" height="98" rx="5" class="padding"/>
  <rect x="188" y="132" width="524" height="54" rx="5" class="content"/>
  <text x="450" y="169" text-anchor="middle" class="lbl">Task card 1</text>
  <rect x="150" y="218" width="600" height="88" class="margin"/>
  <text x="450" y="275" text-anchor="middle" class="lbl" style="font-family:DejaVu Sans Mono, Consolas, monospace;fill:#263C55">margin-bottom: 1.5rem</text>
  <rect x="150" y="306" width="600" height="116" rx="10" class="border"/>
  <rect x="159" y="315" width="582" height="98" rx="5" class="padding"/>
  <rect x="188" y="336" width="524" height="54" rx="5" class="content"/>
  <text x="450" y="373" text-anchor="middle" class="lbl">Task card 2</text>
  <rect x="150" y="422" width="600" height="88" class="margin"/>
  <text x="450" y="475" text-anchor="middle" class="lbl" style="font-family:DejaVu Sans Mono, Consolas, monospace;fill:#263C55">margin-bottom: 1.5rem</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 248" role="img">
  <title>Status Legend Color</title>
  <desc>Three Task Manager cards marked only by colored status dots, with a legend mapping red to high, amber to medium and green to low priority.</desc>
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
      font-size: 20px;
    }
    .heading { font-size: 24px; font-weight: 700; }
    .annotation { font-size: 16px; fill: #526B80; }
    .detail { font-size: 14px; fill: #526B80; }
  </style>
  <rect x="8" y="8" width="374" height="232" rx="8" fill="#FAFBFC" stroke="#CAD5E0" stroke-width="2" />
  <rect x="24" y="24" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <circle cx="48" cy="48" r="10" fill="#C0392B" />
  <text x="70" y="55">Review pull request</text>
  <rect x="24" y="82" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <circle cx="48" cy="106" r="10" fill="#E6A23C" />
  <text x="70" y="113">Update documentation</text>
  <rect x="24" y="140" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2" />
  <circle cx="48" cy="164" r="10" fill="#2E9E4F" />
  <text x="70" y="171">Inspect keyboard focus</text>
  <circle cx="40" cy="214" r="8" fill="#C0392B" />
  <text x="56" y="220" class="annotation">High</text>
  <circle cx="130" cy="214" r="8" fill="#E6A23C" />
  <text x="146" y="220" class="annotation">Medium</text>
  <circle cx="250" cy="214" r="8" fill="#2E9E4F" />
  <text x="266" y="220" class="annotation">Low</text>
</svg>

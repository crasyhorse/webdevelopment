<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #263C55;
    }
    .lbl {
      font-size: 28px;
      font-weight: 700;
    }
    .note {
      font-size: 23px;
    }
    .small {
      font-size: 19px;
    }
    .card {
      fill: #FAFBFC;
      stroke: #526B80;
      stroke-width: 5;
    }
    .content {
      fill: #A8C8D9;
      stroke: #4C7186;
      stroke-width: 3;
    }
    .padding {
      fill: #C8D59A;
    }
    .border {
      fill: #E7D89B;
      stroke: #8C7428;
      stroke-width: 3;
    }
    .margin {
      fill: #EBC08F;
      stroke: #9A6A2C;
      stroke-width: 2;
      stroke-dasharray: 9 7;
    }
  </style>
  <rect width="900" height="560" fill="#F3F6F9"/>
  <rect x="20" y="20" width="860" height="520" rx="18" fill="#fff" stroke="#CAD5E0" stroke-width="2"/>
  <title id="title">Border around task card</title>
  <desc id="desc">An ocker border surrounds the green padding and blue content area of a task card.</desc>
  <text x="450" y="83" text-anchor="middle" class="lbl">Border — the visible edge</text>
  <rect x="154" y="146" width="592" height="278" rx="8" class="border"/>
  <rect x="178" y="170" width="544" height="230" rx="3" class="padding"/>
  <rect x="225" y="216" width="450" height="138" rx="5" class="content"/>
  <text x="450" y="294" text-anchor="middle" class="lbl">Review the pull request</text>
</svg>

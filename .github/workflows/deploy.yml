name: Publish workshop presentations

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Build available presentations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site"
          cat > "$GITHUB_WORKSPACE/site/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Web Development Workshop</title>
          <h1>Web Development Workshop</h1>
          <ul>
          HTML

          for branch in html css javascript; do
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "Skipping '$branch': branch does not exist."
              continue
            fi

            git fetch origin "$branch"
            workdir="$RUNNER_TEMP/workshop-$branch"
            git worktree add --detach "$workdir" "origin/$branch"

            if [[ ! -f "$workdir/$branch/slides.md" ]]; then
              echo "Skipping '$branch': $branch/slides.md does not exist."
              continue
            fi

            (
              cd "$workdir"
              pnpm install --frozen-lockfile
              pnpm exec slidev build "$branch/slides.md" \
                --base "/webdevelopment/$branch/" \
                --out "$GITHUB_WORKSPACE/site/$branch" \
                --without-notes
            )
            printf '  <li><a href="./%s/">%s</a></li>\n' "$branch" "$branch" >> "$GITHUB_WORKSPACE/site/index.html"
          done

          cat >> "$GITHUB_WORKSPACE/site/index.html" <<'HTML'
          </ul>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
